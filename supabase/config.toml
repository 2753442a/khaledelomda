project_id = "dwvivykudgrulqntskqk"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "https://localhost:5173"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.rate_limit]
email_sent = 2
sms_sent = 3
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
anonymous_users = 0

[functions.bootstrap-owner]
verify_jwt = true

[functions.reset-password-pin]
verify_jwt = false

[functions.verify-payment]
verify_jwt = true
